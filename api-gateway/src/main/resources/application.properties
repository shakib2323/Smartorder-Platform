#server.port=8084 for local development
server.port=${PORT:8084}
server.shutdown=graceful

spring.application.name=api-gateway
spring.lifecycle.timeout-per-shutdown-phase=20s

# Timeouts: connect in ms, response as a duration
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=1000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s

# Retry only GET requests (safe to repeat) on connection errors, 502 and 503.
# POST is never retried here: repeating a non-idempotent request is dangerous.
spring.cloud.gateway.server.webflux.default-filters[0].name=Retry
spring.cloud.gateway.server.webflux.default-filters[0].args.retries=2
spring.cloud.gateway.server.webflux.default-filters[0].args.methods=GET
spring.cloud.gateway.server.webflux.default-filters[0].args.statuses=BAD_GATEWAY,SERVICE_UNAVAILABLE
spring.cloud.gateway.server.webflux.default-filters[0].args.backoff.firstBackoff=100ms
spring.cloud.gateway.server.webflux.default-filters[0].args.backoff.maxBackoff=500ms
spring.cloud.gateway.server.webflux.default-filters[0].args.backoff.factor=2
spring.cloud.gateway.server.webflux.default-filters[0].args.backoff.basedOnPreviousValue=false

# CORS: lets a browser front end call the API. Set CORS_ALLOWED_ORIGINS to your real site(s), comma separated.
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=Authorization,Content-Type,Idempotency-Key,X-Correlation-Id
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers=Location,Content-Disposition,X-Correlation-Id
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600

# Only these public paths are routed. Anything else, including /internal/**, returns 404.
# The URLs come from environment variables, so Docker Compose can override them later.
spring.cloud.gateway.server.webflux.routes[0].id=product-service
spring.cloud.gateway.server.webflux.routes[0].uri=${PRODUCT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/products/**, /api/v1/products, /api/v1/brands/**, /api/v1/brands
spring.cloud.gateway.server.webflux.routes[0].metadata.response-timeout=5000
spring.cloud.gateway.server.webflux.routes[0].metadata.connect-timeout=1000

spring.cloud.gateway.server.webflux.routes[1].id=inventory-service
spring.cloud.gateway.server.webflux.routes[1].uri=${INVENTORY_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/inventory/**
spring.cloud.gateway.server.webflux.routes[1].metadata.response-timeout=5000
spring.cloud.gateway.server.webflux.routes[1].metadata.connect-timeout=1000

# Order may call Product with retries, so it gets more time
spring.cloud.gateway.server.webflux.routes[2].id=order-service
spring.cloud.gateway.server.webflux.routes[2].uri=${ORDER_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/orders/**, /api/v1/orders, /api/v1/cart/**, /api/v1/cart, /api/v1/seller/orders/**, /api/v1/seller/orders
spring.cloud.gateway.server.webflux.routes[2].metadata.response-timeout=10000
spring.cloud.gateway.server.webflux.routes[2].metadata.connect-timeout=1000

# Auth Service
spring.cloud.gateway.server.webflux.routes[3].id=auth-service
spring.cloud.gateway.server.webflux.routes[3].uri=${AUTH_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/auth/**
spring.cloud.gateway.server.webflux.routes[3].metadata.response-timeout=5000
spring.cloud.gateway.server.webflux.routes[3].metadata.connect-timeout=1000


# Eureka Service Discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8762/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

management.endpoints.web.exposure.include=health,info

logging.level.com.shakib.smartorder.gateway=INFO
# Public product image reads are served by Product Service; upload POST stays under /api/v1/products/**
spring.cloud.gateway.server.webflux.routes[4].id=product-images
spring.cloud.gateway.server.webflux.routes[4].uri=${PRODUCT_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/uploads/products/**
spring.cloud.gateway.server.webflux.routes[4].metadata.response-timeout=5000
spring.cloud.gateway.server.webflux.routes[4].metadata.connect-timeout=1000
