#server.port=8083
server.port=${PORT:8083}
spring.application.name=order-service

spring.datasource.url=${ORDER_DB_URL:jdbc:mysql://localhost:3307/orders_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${ORDER_DB_USERNAME:order_user}
spring.datasource.password=${ORDER_DB_PASSWORD:order_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,metrics
management.health.circuitbreakers.enabled=true

logging.pattern.level=%5p [%X{correlationId:-}]

product-service.base-url=${PRODUCT_SERVICE_URL:http://localhost:8081}
product-service.connect-timeout-ms=1000
product-service.read-timeout-ms=2000

resilience4j.circuitbreaker.instances.productService.register-health-indicator=true
resilience4j.circuitbreaker.instances.productService.sliding-window-size=10
resilience4j.circuitbreaker.instances.productService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.productService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.productService.ignore-exceptions=com.shakib.smartorder.order.exception.ProductNotFoundException

resilience4j.retry.instances.productService.max-attempts=3
resilience4j.retry.instances.productService.wait-duration=200ms
resilience4j.retry.instances.productService.ignore-exceptions=com.shakib.smartorder.order.exception.ProductNotFoundException,io.github.resilience4j.circuitbreaker.CallNotPermittedException

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

messaging.enabled=true
outbox.publisher.poll-interval-ms=1000
outbox.publisher.batch-size=50
outbox.publisher.send-timeout-ms=5000
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=3

# Eureka Service Discovery
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8762/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Must equal the Auth Service secret. REQUIRED, no default: export JWT_SECRET=$(openssl rand -base64 48)
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=smartorder-auth

#  Billing 
# Prices are GST-inclusive. Delivery is charged below the free-shipping limit; set the fee to 0 for free delivery.
billing.currency=INR
billing.shipping.flat-fee=49.00
billing.shipping.free-above=999.00

# Reservations 
# A reservation holds stock for the default time (the customer may ask for 1 to 72 hours). The sweeper
# releases reservations that were not confirmed in time.
reservation.default-hold-hours=24
reservation.sweep-interval-ms=60000
