#server.port=8085 for local development
server.port=${PORT:8085}
spring.application.name=auth-service

spring.datasource.url=jdbc:mysql://localhost:3307/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${AUTH_DB_USERNAME:auth_user}
spring.datasource.password=${AUTH_DB_PASSWORD:auth_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info

logging.pattern.level=%5p [%X{correlationId:-}]

#JWT
# JWT_SECRET is required (min 32 characters) - there is deliberately no default, so a forgotten
# variable stops the service at startup instead of running with a publicly known key.
# Generate one:  export JWT_SECRET=$(openssl rand -base64 48)
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=smartorder-auth
app.jwt.expiration-minutes=60

#First admin account 
# Created once on startup if this email does not exist yet. Skipped when ADMIN_PASSWORD is not set.
app.admin.name=Administrator
app.admin.email=admin@smartorder.local
app.admin.password=${ADMIN_PASSWORD:}

#Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8762/eureka/}
eureka.client.healthcheck.enabled=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Login protection
app.login.max-failures=5
app.login.lock-minutes=15
