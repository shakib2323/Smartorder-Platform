#server.port=8762 for local development
server.port=${PORT:8762}
spring.application.name=eureka-server

# This is the registry itself, so it must not try to register with (or read from) another one.
eureka.instance.hostname=localhost
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Local development: don't wait 5 minutes for peers that will never come.
eureka.server.wait-time-in-ms-when-sync-empty=0

management.endpoints.web.exposure.include=health,info
